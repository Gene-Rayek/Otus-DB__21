services:
  mongodb:
    image: mongo:7
    container_name: otus-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: otus
    volumes:
      - mongo_data:/data/db
      - ./init/init.js:/docker-entrypoint-initdb.d/init.js:ro

volumes:
  mongo_data:

